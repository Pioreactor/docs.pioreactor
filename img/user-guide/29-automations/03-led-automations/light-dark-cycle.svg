<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="550" viewBox="0 0 1100 550" role="img" aria-labelledby="title desc"><title id="title">The light dark schedule starts with light</title><desc id="desc">LED intensity alternates between the configured light intensity and zero. The first phase is light. Each period consists of the configured light duration followed by dark duration.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="#526078"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="#087e8b"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="#a84b48"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1100" height="550" rx="16" fill="#f8fafc" stroke="none"/>
<text x="34" y="43" font-size="26" fill="#243247" font-weight="700" text-anchor="start">The light/dark cycle starts with light</text>
<text x="34" y="73" font-size="17" fill="#526078" font-weight="400" text-anchor="start">Channels C and D follow the same schedule.</text>
