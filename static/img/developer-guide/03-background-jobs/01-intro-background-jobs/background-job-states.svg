<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">The life of a background job</title><desc id="desc">A background job initializes and becomes ready. Ready and sleeping states are connected by pause and resume. Graceful shutdown disconnects the job. An unexpected loss of connection is reported as lost.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="#526078"/></marker><marker id="teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="#087e8b"/></marker><marker id="red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8" fill="#a84b48"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1100" height="520" rx="16" fill="#f8fafc" stroke="none"/>
<text x="34" y="43" font-size="26" fill="#243247" font-weight="700" text-anchor="start">The life of a background job</text>
<text x="34" y="73" font-size="17" fill="#526078" font-weight="400" text-anchor="start">The UI calls the sleeping state “Paused”.</text>
<rect x="42" y="167" width="200" height="82" rx="10" fill="#ffffff" stroke="#d3dce7"/>
<text x="142" y="198" font-size="20" fill="#243247" font-weight="700" text-anchor="middle">init</text>
<text x="142" y="224" font-size="16" fill="#526078" font-weight="400" text-anchor="middle">Initializing</text>
<rect x="359" y="167" width="234" height="82" rx="10" fill="#e1f2f2" stroke="#d3dce7"/>
<text x="476" y="198" font-size="20" fill="#087e8b" font-weight="700" text-anchor="middle">ready</text>
<text x="476" y="224" font-size="16" fill="#526078" font-weight="400" text-anchor="middle">Working or ready to work</text>
<rect x="824" y="167" width="234" height="82" rx="10" fill="#e7eef8" stroke="#d3dce7"/>
<text x="941" y="198" font-size="20" fill="#3c6aa0" font-weight="700" text-anchor="middle">disconnected</text>
<text x="941" y="224" font-size="16" fill="#526078" font-weight="400" text-anchor="middle">Clean shutdown</text>
<path d="M243 208H351" fill="none" stroke="#526078" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" />
<text x="298" y="195" font-size="16" fill="#526078" font-weight="400" text-anchor="middle">Start</text>
<path d="M594 208H816" fill="none" stroke="#526078" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" />
<text x="707" y="194" font-size="16" fill="#526078" font-weight="400" text-anchor="middle">Stop &amp; clean up</text>
<rect x="359" y="350" width="234" height="82" rx="10" fill="#fff0d4" stroke="#d3dce7"/>
<text x="476" y="381" font-size="20" fill="#a66b10" font-weight="700" text-anchor="middle">sleeping</text>
<text x="476" y="407" font-size="16" fill="#526078" font-weight="400" text-anchor="middle">Paused in the UI</text>
<path d="M425 250V342" fill="none" stroke="#526078" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" />
<text x="410" y="299" font-size="16" fill="#526078" font-weight="400" text-anchor="end">Pause</text>
<path d="M525 349V258" fill="none" stroke="#526078" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" />
<text x="540" y="305" font-size="16" fill="#526078" font-weight="400" text-anchor="start">Resume</text>
<path d="M594 392H941V257" fill="none" stroke="#526078" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)" />
<text x="956" y="326" font-size="16" fill="#526078" font-weight="400" text-anchor="start">Stop</text>
<text x="956" y="350" font-size="16" fill="#526078" font-weight="400" text-anchor="start">&amp; clean up</text>
<rect x="42" y="350" width="235" height="82" rx="10" fill="#f9e7e5" stroke="none"/>
<text x="159" y="382" font-size="21" fill="#a84b48" font-weight="700" text-anchor="middle">lost</text>
<text x="159" y="408" font-size="16" fill="#a84b48" font-weight="400" text-anchor="middle">Unexpected disconnection</text>
<path d="M142 250V342" fill="none" stroke="#a84b48" stroke-width="2" stroke-linejoin="round" marker-end="url(#red)" stroke-dasharray="5 5"/>
<text x="159" y="288" font-size="15" fill="#a84b48" font-weight="400" text-anchor="start">Unexpected</text>
<text x="159" y="310" font-size="15" fill="#a84b48" font-weight="400" text-anchor="start">connection loss</text>
<text x="34" y="495" font-size="15" fill="#526078" font-weight="400" text-anchor="start">Simplified lifecycle. A lost status can be reported when the connection drops from any state.</text></g></svg>